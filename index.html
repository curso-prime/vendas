<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Cursos - Curso de Vendas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            color: #333;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            color: #0056b3;
            margin: 0 0 8px 0;
            font-size: 2.2em;
            letter-spacing: -0.5px;
        }
        .subtitulo {
            color: #6c757d;
            margin-bottom: 40px;
            font-size: 1.1em;
            font-weight: 500;
        }
        .link-box {
            margin: 20px 0;
        }
        .btn-link {
            display: block;
            background-color: #0056b3;
            color: #ffffff;
            text-decoration: none;
            padding: 18px 25px;
            font-size: 1.1em;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 86, 179, 0.2);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }
        .btn-link:hover {
            background-color: #004494;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 86, 179, 0.3);
        }
        .btn-prova {
            background-color: #28a745;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.2);
        }
        .btn-prova:hover {
            background-color: #218838;
            box-shadow: 0 6px 15px rgba(40, 167, 69, 0.3);
        }
        .btn-voltar {
            background-color: #6c757d;
            box-shadow: 0 4px 10px rgba(108, 117, 125, 0.2);
        }
        .btn-voltar:hover {
            background-color: #5a6268;
            box-shadow: 0 6px 15px rgba(108, 117, 125, 0.3);
        }
        .texto-suporte {
            margin-top: 35px;
            color: #555;
            font-size: 0.95em;
            line-height: 1.6;
        }
        .texto-suporte strong {
            color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Prime Cursos</h1>
    <div class="subtitulo">Capacitação Online - Curso de Vendas</div>

    <div class="link-box">
        <a href="https://b2storage.primecursos.com.br/file/filespdf/Curso-de-Vendas.pdf" class="btn-link" target="_blank">Material para estudo do curso</a>
    </div>

    <div class="link-box">
        <a href="https://curso-prime.github.io/curso-vendas/" class="btn-link btn-prova" target="_blank">Realizar a prova</a>
    </div>

    <div class="link-box">
        <a href="https://curso-prime.github.io/.com.br" class="btn-link btn-voltar">Voltar para outros cursos</a>
    </div>

    <div class="texto-suporte">
        Precisa falar com o suporte?<br>
        <strong>Clique no balão verde no canto inferior direito</strong> da tela para ser atendido ao vivo!
    </div>
</div>
